apiVersion: v1
kind: Secret
metadata:
  name: aegisops-secrets
  namespace: aegisops-prod
type: Opaque
stringData:
  POSTGRES_USER: "aegis_admin"
  POSTGRES_PASSWORD: "AegisSecurePass2026!"
  POSTGRES_DB: "aegisops_db"
  DATABASE_URL: "postgresql://aegis_admin:AegisSecurePass2026!@postgres:5432/aegisops_db"
  JWT_SECRET: "super-secure-production-jwt-token-2026"
  GEMINI_API_KEY: "replace-with-your-real-key"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: aegisops-prod
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path # Tận dụng local-path có sẵn trên K3s, 0 đồng tiền AWS EBS
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: aegisops-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: aegisops-secrets
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-storage
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: aegisops-prod
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: aegisops-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: aegisops-prod
spec:
  ports:
    - port: 6379
      targetPort: 6379
  selector:
    app: redis
