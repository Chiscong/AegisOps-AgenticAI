apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-service
  namespace: aegisops-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator-service
  template:
    metadata:
      labels:
        app: orchestrator-service
    spec:
      containers:
        - name: orchestrator
          image: python:3.12-slim
          command: ["sh", "-c", "echo 'AI Orchestrator Agent Running' && sleep infinity"]
          ports:
            - containerPort: 8002
          envFrom:
            - secretRef:
                name: aegisops-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
  namespace: aegisops-prod
spec:
  ports:
    - port: 8002
      targetPort: 8002
  selector:
    app: orchestrator-service
---
apiVersion: apps/v1
