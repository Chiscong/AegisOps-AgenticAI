      app: scanner-worker-service
  template:
    metadata:
      labels:
        app: scanner-worker-service
    spec:
      containers:
        - name: scanner-worker
          image: python:3.12-slim
          command: ["sh", "-c", "echo 'Scanner Worker Ready' && sleep infinity"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 400m
              memory: 256Mi
