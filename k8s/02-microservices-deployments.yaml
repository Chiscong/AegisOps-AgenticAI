    matchLabels:
      app: frontend-service
  template:
    metadata:
      labels:
        app: frontend-service
    spec:
      containers:
        - name: frontend
          image: node:20-alpine
          command: ["sh", "-c", "echo 'Next.js Frontend Running' && sleep infinity"]
