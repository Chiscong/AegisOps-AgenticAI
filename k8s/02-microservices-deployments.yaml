apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: aegisops-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway
          image: python:3.12-slim
          command: ["sh", "-c", "echo 'Gateway Microservice Running' && sleep infinity"]
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: aegisops-prod
spec:
  ports:
    - port: 8000
      targetPort: 8000
  selector:
    app: gateway-service
---
