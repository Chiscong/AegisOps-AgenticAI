apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegisops-ingress
  namespace: aegisops-prod
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600" # Timeout dài cho SSE streaming
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
spec:
  tls:
    - hosts:
        - aegis.yourdomain.com # Thay thế bằng domain hoặc dynamic DNS của bạn
      secretName: aegisops-tls-cert
  rules:
    - host: aegis.yourdomain.com
      http:
        paths:
          # Định tuyến API Gateway
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 8000
          # Định tuyến Web Frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 3000
