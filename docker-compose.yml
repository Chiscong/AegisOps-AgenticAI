services:
  # ==========================================
  # 1. HẠ TẦNG CƠ SỞ DỮ LIỆU & CACHING
  # ==========================================
  postgres:
    image: postgres:16-alpine
    container_name: aegisops-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aegis_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-AegisSecurePass2026!}
      POSTGRES_DB: ${POSTGRES_DB:-aegisops_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_admin -d aegisops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aegis-network

  redis:
    image: redis:7-alpine
    container_name: aegisops-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - aegis-network

  # ==========================================
  # 2. MICROSERVICES APPLICATION LAYER
  # ==========================================
  gateway-service:
    build:
      context: ./apps/gateway-service
      dockerfile: Dockerfile
    container_name: aegisops-gateway
    restart: unless-stopped
    environment:
      - PORT=8000
      - AUTH_SERVICE_URL=http://auth-service:8001
      - ORCHESTRATOR_URL=http://orchestrator-service:8002
      - RAG_SERVICE_URL=http://knowledge-rag-service:8003
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - orchestrator-service
      - knowledge-rag-service
    networks:
      - aegis-network

  auth-service:
    build:
      context: ./apps/auth-service
      dockerfile: Dockerfile
    container_name: aegisops-auth
    restart: unless-stopped
    environment:
      - PORT=8001
      - DATABASE_URL=postgresql://aegis_admin:AegisSecurePass2026!@postgres:5432/aegisops_db
      - JWT_SECRET=${JWT_SECRET_KEY:-super-secret-aegisops-jwt-key-2026}
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - aegis-network

  orchestrator-service:
    build:
      context: ./apps/orchestrator-service
      dockerfile: Dockerfile
    container_name: aegisops-orchestrator
    restart: unless-stopped
    environment:
      - PORT=8002
      - SCANNER_WORKER_URL=http://scanner-worker-service:8004
      - RAG_SERVICE_URL=http://knowledge-rag-service:8003
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8002:8002"
    depends_on:
      - scanner-worker-service
      - knowledge-rag-service
      - redis
    networks:
      - aegis-network

  scanner-worker-service:
    build:
      context: ./apps/scanner-worker
      dockerfile: Dockerfile
    container_name: aegisops-worker
    restart: unless-stopped
    environment:
      - PORT=8004
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8004:8004"
    networks:
      - aegis-network

  knowledge-rag-service:
    build:
      context: ./apps/knowledge-rag
      dockerfile: Dockerfile
    container_name: aegisops-rag
    restart: unless-stopped
    environment:
      - PORT=8003
    ports:
      - "8003:8003"
    networks:
      - aegis-network

  frontend-service:
    image: node:20-alpine
    container_name: aegisops-frontend
    working_dir: /app
    restart: unless-stopped
    volumes:
      - ./apps/frontend:/app
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_GATEWAY=http://localhost:8000
    depends_on:
      - gateway-service
    networks:
      - aegis-network

networks:
  aegis-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
